name: Derle ve test et (Windows + Android)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Çeviri dosyalarını ve ortak test vakalarını denetle
        run: |
          python tools/check_i18n.py
          python tools/make_vectors.py --check

      - name: Birim testleri
        run: python tools/run_tests.py tests.test_units

      - name: Uçtan uca testler (gerçek Microsoft Edge + sahte Instagram)
        env:
          INSTAGRAM_INDIRICI_BROWSER: msedge
        run: python tools/run_tests.py tests.test_integration

      - name: Gerçek Instagram denemesi (bilgi amaçlı, giriş yapmadan)
        continue-on-error: true
        timeout-minutes: 12
        env:
          INSTAGRAM_INDIRICI_BROWSER: msedge
          INSTAGRAM_INDIRICI_BACKOFF: "15"
        run: python tools/canli_deneme.py instagram

      - name: Deneme sonucunu ci-sonuc dalına koy
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          cp canli-deneme.txt ci-out/ 2>/dev/null || echo "deneme dosyası yok" > ci-out/canli-deneme.txt
          branch="ci-sonuc-${GITHUB_REF_NAME//\//-}"
          cd ci-out
          git init -q
          git checkout -q -b "$branch"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "CI sonucu ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch"

      - name: EXE derle
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name InstagramIndirici
          --icon assets/icon.ico
          --add-data "instagram_indirici/ui;instagram_indirici/ui"
          --add-data "instagram_indirici/chrome_eklenti;instagram_indirici/chrome_eklenti"
          --add-data "ceviriler;ceviriler"
          --collect-all playwright
          --collect-all imageio_ffmpeg
          main.py

      - name: EXE'yi dene
        shell: pwsh
        run: |
          trap {
            $m = ($_ | Out-String) -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=EXE testi::$m"
            exit 1
          }
          function Run-Exe([string]$arg, [string]$label) {
            $out = "$PWD\selftest-$label.txt"
            $env:INSTAGRAM_INDIRICI_SELFTEST_OUT = $out
            Remove-Item $out -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "dist\InstagramIndirici.exe" -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "$label : zaman aşımı" }
            $r = Get-Content $out -Raw
            Write-Host "$label => $r"
            if (-not $r.StartsWith("OK")) { throw "$label başarısız: $r" }
            return $r.Trim()
          }
          "{0:N1} MB" -f ((Get-Item dist\InstagramIndirici.exe).Length / 1MB)

          # 1) Normal bilgisayar: Edge sağlam
          Run-Exe "--self-test" "normal-tarayici"
          Run-Exe "--self-test-window" "normal-pencere"

          # 2) Edge de Chrome da yok sayılırsa: program kendi tarayıcısını indirip kullanmalı
          $env:INSTAGRAM_INDIRICI_FORCE_BUNDLED = "1"
          $env:INSTAGRAM_INDIRICI_DATA = "$env:RUNNER_TEMP\ii-bundled"
          $r = Run-Exe "--self-test-window" "indirilen-pencere"
          if ($r -notin @("OK chromium", "OK download")) { throw "indirilen tarayıcı kullanılmadı: $r" }
          Run-Exe "--self-test" "indirilen-tarayici"
          Remove-Item Env:INSTAGRAM_INDIRICI_FORCE_BUNDLED
          Remove-Item Env:INSTAGRAM_INDIRICI_DATA

          # 3) Edge güncellemesi yarım kalmışsa (msedge_elf.dll eksik) program takılmamalı
          Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          $broken = 0
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\msedge_elf.dll", "$env:ProgramFiles\Microsoft\Edge\Application\*\msedge_elf.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Rename-Item $_.FullName "msedge_elf.dll.bozuk"; $broken++
          }
          if ($broken -eq 0) { throw "Edge bozulamadı (test kurulumu)" }
          $r = Run-Exe "--self-test-window" "bozuk-edge-pencere"
          if ($r -eq "OK edge") { throw "bozuk Edge kullanılmaya çalışıldı" }
          $r = Run-Exe "--self-test" "bozuk-edge-tarayici"
          if ($r -match "Edge") { throw "bozuk Edge ile tarayıcı açılmaya çalışıldı: $r" }

      - uses: actions/upload-artifact@v4
        with:
          name: InstagramIndirici
          path: dist/InstagramIndirici.exe

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sahte Instagram sunucularını başlat
        run: |
          nohup python -m tests.fake_instagram --port 8766 > fake-jvm.log 2>&1 &
          nohup python -m tests.fake_instagram --port 8765 --public http://10.0.2.2:8765 > fake.log 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8766/__durum" > /dev/null
          curl -sf "http://127.0.0.1:8765/__durum" > /dev/null

      - name: Birim testleri ve APK
        shell: bash
        env:
          FAKE_INSTAGRAM: http://127.0.0.1:8766
        run: |
          python tools/check_i18n.py
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      - name: Derleme / birim testi hatalarını özetle
        if: failure()
        shell: bash
        run: |
          python tools/annotate_junit.py "Android birim testi" android/app/build/test-results || true
          if [ -f build.log ]; then
            errors=$(grep -E "^e: " build.log | sed -E 's#file:///home/runner/work/[^ ]*/instagramindirici/##' | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$errors" ] || errors=$(grep -E "What went wrong|Could not|FAILED|Exception" -A6 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android derleme hatası::${errors}"
          fi

      - name: Birim testi sonuçları
        if: success()
        run: python tools/annotate_junit.py "Android birim testi" android/app/build/test-results

      - name: KVM'yi aç (emülatör için)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde uçtan uca testler
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_e2e.sh

      - name: Uçtan uca test sonuçları
        if: always()
        run: python tools/annotate_junit.py "Android uçtan uca" android/app/build/outputs/androidTest-results || true

      - name: Ekran görüntülerini ve günlükleri ci-sonuc dalına koy
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          cp fake.log fake-jvm.log build.log ci-out/ 2>/dev/null || true
          cp -r android/app/build/test-results ci-out/unit-test-results 2>/dev/null || true
          cp -r android/app/build/outputs/androidTest-results ci-out/e2e-results 2>/dev/null || true
          branch="ci-android-${GITHUB_REF_NAME//\//-}"
          cd ci-out
          git init -q
          git checkout -q -b "$branch"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "CI sonucu ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch"

      - name: APK'yı adlandır
        run: |
          version=$(python -c "import instagram_indirici as d; print(d.__version__)")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/InstagramIndirici-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: InstagramIndirici-apk
          path: out/*.apk

  eklenti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Chrome eklentisi testleri (gerçek Chromium + sahte Instagram)
        env:
          INSTAGRAM_INDIRICI_BROWSER: chromium
        run: |
          python tools/run_tests.py tests.test_extension
          python tools/run_tests.py tests.test_chrome_indirici

      - name: Chrome eklentisini zip'le
        run: |
          mkdir -p out
          (cd chrome_indirici && zip -r ../out/InstagramIndirici-Chrome.zip . -x "*.DS_Store")

      - uses: actions/upload-artifact@v4
        with:
          name: InstagramIndirici-Chrome
          path: out/InstagramIndirici-Chrome.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android, eklenti]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını oku
        id: ver
        run: echo "version=$(python3 -c 'import instagram_indirici as d; print(d.__version__)')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Instagram İndirici ${{ steps.ver.outputs.version }}
          make_latest: true
          files: |
            dist/InstagramIndirici/InstagramIndirici.exe
            dist/InstagramIndirici-apk/*.apk
            dist/InstagramIndirici-Chrome/InstagramIndirici-Chrome.zip
          body: |
            **Bu sürümde:** Öne çıkanlar artık iniyor: Instagram öne çıkan sayfasında "Hikayeyi Gör" onayı istiyor, program bu düğmeye basıyor (karşı taraf izleyenlerde hesabını görebilir). Windows, Android ve Chrome eklentisinde.

            **Windows:** `InstagramIndirici.exe` dosyasını indir, çift tıklayıp aç. Kurulum gerekmez.
            İlk açılışta Windows "Bilgisayarınız korundu" uyarısı verebilir: **Ek bilgi → Yine de çalıştır**.

            **Android:** telefondan `InstagramIndirici-${{ steps.ver.outputs.version }}.apk` dosyasına dokunup kur.
            Telefon "bilinmeyen kaynak" izni isterse ver. Instagram'da bir gönderide ya da profilde **Paylaş → Instagram İndirici** ile link doğrudan gelir.

            **Chrome eklentisi:** `InstagramIndirici-Chrome.zip` dosyasını indirip bir klasöre çıkar. Chrome'da `chrome://extensions` aç, **Geliştirici modu**nu aç, **Paketlenmemiş öğe yükle** (Load unpacked) ile çıkardığın klasörü seç. Sonra Instagram'da giriş yapıp eklenti simgesine bas.

            Profilin tamamını, hikayeleri ve öne çıkanları indirmek için programın altındaki **Instagram'a giriş yap** ile bir kez giriş yap. Ana hesabın yerine yedek bir hesap kullanman daha güvenli.
